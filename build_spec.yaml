# OCI DevOps build pipeline, stage 1: build the worker image on the OCI build
# runner from the commit being built. Stage 2 (deliver artifacts) pushes it to
# OCIR as the pipeline's own identity; stage 3 (roll_spec.yaml) replaces the
# workers with it. Nothing outside OCI is involved.
version: 0.1
component: build
timeoutInSeconds: 1800
shell: bash
env:
  exportedVariables:
    - IMAGE_TAG
steps:
  - type: Command
    name: Tag
    command: |
      export IMAGE_TAG="b${OCI_BUILD_RUN_ID: -10}"
      echo "image tag ${IMAGE_TAG}"
  - type: Command
    name: Build the worker image
    command: |
      cd "${OCI_PRIMARY_SOURCE_DIR}"
      docker build -f factory/Dockerfile -t worker:${IMAGE_TAG} .
outputArtifacts:
  - name: worker
    type: DOCKER_IMAGE
    location: worker:${IMAGE_TAG}
