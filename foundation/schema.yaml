# Resource Manager form for installing Sandbox Factory in a tenancy.
#
# One stack, one click: the compartment tree, network, vault, budget, the
# control database with the application, the IAM the factory needs and the
# workers. On their first start the workers install the application, load the
# assistant's prompts and detect which AI models this region serves. The
# outputs are the application URL and the first login.
title: Sandbox Factory
description: >-
  Self-service, AI-planned OCI sandboxes that delete themselves. Users describe what
  they need in a chat; the factory builds it in its own compartment with Terraform,
  gives them the links and passwords, and removes it when its lifetime ends.
  Requires a tenancy administrator for the install (it creates IAM policies) and a
  Pay-As-You-Go or paid account.
schemaVersion: 1.1.0
version: "1.0"
locale: en

variableGroups:
  - title: Hidden
    visible: false
    variables:
      - tenancy_ocid
      - region
      - current_user_ocid
      - enable_control_adb
      - enable_worker

  - title: Install
    variables:
      - parent_compartment_ocid
      - prefix
      - owner
      - budget_alert_email
      - budget_amount

  - title: Capacity
    variables:
      - worker_count
      - enable_aidp

  - title: Advanced
    visible: false
    variables:
      - environment
      - team
      - budget_alert_thresholds
      - enable_quotas
      - quota_limits
      - worker_image
      - ocir_user
      - ocir_token
      - control_adb_allowed_cidrs
      - admin_cidr
      - vcn_cidr
      - public_subnet_cidr
      - private_subnet_cidr

variables:
  parent_compartment_ocid:
    type: oci:identity:compartment:id
    title: Parent compartment
    description: Everything the factory creates goes in a new compartment tree under this one.
    required: true
    default: ${tenancy_ocid}

  prefix:
    type: string
    title: Name prefix
    description: >-
      Names the compartments, IAM policies, tag namespace, network and budget. Use a new
      prefix for a second install in the same tenancy (IAM names are tenancy-wide).
    default: sbx
    required: true
    pattern: "^[a-z][a-z0-9]{1,11}$"

  owner:
    type: string
    title: Owner
    description: Your email. The first application login is created for it, and resources are tagged with it.
    required: true

  budget_alert_email:
    type: string
    title: Budget alert email
    description: Where budget alerts are sent. Comma-separate for several recipients.
    required: true
    pattern: "^[^@\\s]+@[^@\\s]+\\.[^@\\s]+([,\\s]*[^@\\s]+@[^@\\s]+\\.[^@\\s]+)*$"

  budget_amount:
    type: number
    title: Monthly budget
    description: In the tenancy currency, for everything the factory runs. Alerts at 50/80/100 percent.
    default: 200
    minimum: 1
    required: true

  worker_count:
    type: integer
    title: Workers
    description: How many sandboxes can be built at the same time. Each worker is a 1 OCPU container instance.
    default: 3
    minimum: 1
    maximum: 10
    required: true

  enable_aidp:
    type: boolean
    title: Allow Oracle AI Data Platform
    description: Grants the AI Data Platform service what it needs, so data pipelines can include an AIDP workspace.
    default: true

  environment:
    type: enum
    title: Environment label
    enum: [personal, dev, prod]
    default: personal

  team:
    type: string
    title: Team tag
    default: personal

  budget_alert_thresholds:
    type: array
    title: Alert thresholds (percent of budget)
    items:
      type: number
    default: [50, 80, 100]

  enable_quotas:
    type: boolean
    title: Create hard quotas
    description: Caps cores, database ECPUs and similar on the sandbox compartment. Quota names differ per region; confirm them before turning this on.
    default: false

  worker_image:
    type: string
    title: Worker image
    description: The published release by default. Point it at your own build of factory/Dockerfile to run a fork.
    required: true

  ocir_user:
    type: string
    title: Registry user
    description: Login used to push the images users build. Empty = the installing user.

  ocir_token:
    type: password
    title: Registry auth token
    description: Empty = one is created for the installing user (a user may hold two).

  control_adb_allowed_cidrs:
    type: array
    title: Who may reach the application
    description: IP ranges allowed to the control database (the application runs there). Everyone by default.
    items:
      type: string
    default: ["0.0.0.0/0"]

  admin_cidr:
    type: string
    title: SSH source CIDR on the public subnet
    default: 0.0.0.0/0

  vcn_cidr:
    type: string
    title: VCN CIDR
    default: 10.20.0.0/16

  public_subnet_cidr:
    type: string
    title: Public subnet CIDR
    default: 10.20.0.0/24

  private_subnet_cidr:
    type: string
    title: Private subnet CIDR
    default: 10.20.10.0/24

outputGroups:
  - title: Start here
    outputs:
      - app_url
      - app_admin_user
      - app_admin_password
  - title: Details
    outputs:
      - compartments
      - network
      - workers

outputs:
  app_url:
    title: Application
    type: link
  app_admin_user:
    title: Sign in as
    type: string
  app_admin_password:
    title: Password
    type: string
    sensitive: true
  compartments:
    title: Compartments
    type: string
  network:
    title: Network
    type: string
  workers:
    title: Workers
    type: string
